spring:
  datasource:
    # Use H2 in PostgreSQL compatibility mode
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Automatically builds database schema for tests and drops on exit
    show-sql: true

  # Disable Flyway/Liquibase schema migrations in tests if using ddl-auto
  flyway:
    enabled: false

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service-docs
              uri: http://product-catalog:8080
              predicates:
                - Path=/product-catalog/v3/api-docs
              filters:
                - RewritePath=/product-catalog/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: Product Catalog
        url: /product-catalog/v3/api-docs

spring:
  application:
    name: api-gateway
  security:
    user:
      name: admin
      password: password123

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/api_gateway_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 10

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP:localhost:29092}
    gateway:
      server:
        webflux:
          # Global CORS Configuration
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"

          # Route Definitions
          routes:
            - id: auth-service
              uri: http://auth-service:8080
              predicates:
                - Path=/api/v1/auth/**
            - id: product-service
              uri: http://product-catalog:8080
              predicates:
                - Path=/api/v1/products/**, /api/v1/categories/**
              filters:
                - AddRequestHeader=X-Gateway-Request, ApiGateway
            - id: product-service-docs
              uri: http://product-catalog:8080
              predicates:
                - Path=/product-catalog/v3/api-docs
              filters:
                - RewritePath=/product-catalog/v3/api-docs, /v3/api-docs

server:
  port: 8080

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

  # Tracing
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging
logging:
  level:
    root: INFO
    com.rdavies: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt :
  secret : ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:9000000}